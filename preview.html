<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AE Employer Drill-Down — local preview</title>
<style>
  body { margin: 0; padding: 20px; background: #eef1f4; font-family: Arial, sans-serif; }
  h2 { font-family: Arial, sans-serif; color: #333; }
  button { margin-bottom: 12px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  com-porticobenefits-aedrilldown { display: block; width: 900px; height: 420px; }
</style>
</head>
<body>
<h2>AE Employer Drill-Down — standalone preview (mock data, exercises the real SAC widget lifecycle hooks)</h2>
<button id="toggle">Toggle mock: selected employer</button>
<com-porticobenefits-aedrilldown id="widget"></com-porticobenefits-aedrilldown>

<script src="main.js"></script>
<script>
  // Drive the widget the same way SAC would: call the lifecycle hooks with
  // changedProperties. Real Input Control filtering can't be simulated
  // standalone, so this button swaps between the two mock ResultSets
  // baked into main.js to exercise both render states.
  const widget = document.getElementById("widget");
  widget.onCustomWidgetBeforeUpdate({ width: 900, height: 420 });
  widget.onCustomWidgetAfterUpdate({ width: 900, height: 420 });

  const WidgetClass = customElements.get("com-porticobenefits-aedrilldown");
  let selected = false;
  document.getElementById("toggle").addEventListener("click", () => {
    selected = !selected;
    const data = selected ? WidgetClass.MOCK_YOY_SELECTED : WidgetClass.MOCK_YOY_LIST;
    widget.onCustomWidgetAfterUpdate({ employerYoy: data });
  });
</script>
</body>
</html>
